[project]
name = "rrip"
version = "0.1.0"
description = "Retail Revenue Intelligence Platform"
requires-python = ">=3.12,<3.13"

# CORE = what the API needs to serve the published tier, and nothing else.
#
# This split is deliberate and load-bearing. The scientific stack is 332.9 MB
# against 30.0 MB for these, and Vercel's serverless limit is 250 MB. Listing
# pandas here would put the whole pipeline into every deployment to run code
# that never executes on the published tier -- and would put the API over the
# limit, which is what made a separate paid host look necessary.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg_pool>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Everything the local pipeline needs: load, profile, benchmark, publish,
# and causal estimation. Never installed on the published tier.
#
# pandas is pinned below 3.0 deliberately -- DoWhy and statsmodels trail pandas
# majors, the same reasoning that put this project on Python 3.12.
pipeline = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "sqlalchemy>=2.0",
    "statsmodels>=0.14",
    "scipy>=1.13",
    # AUDIT NOTE, 2026-08-14: dowhy and matplotlib are declared but imported
    # NOWHERE in src/, tests/ or eval/. Causal estimation is statsmodels
    # throughout (see rrip.ai.causal); dowhy was the route by which
    # scikit-learn used to arrive, and scikit-learn is now declared directly
    # below. They are retained pending a decision rather than dropped here,
    # because the pandas<3.0 pin above is justified by DoWhy's release cadence
    # and removing one without revisiting the other would leave a pin with no
    # stated reason.
    "dowhy>=0.11",
    "matplotlib>=3.9",
    # Declared explicitly rather than inherited from DoWhy, which happens to
    # pull both. rrip.forecast imports them directly, and a transitive
    # dependency that a sibling package could drop in a minor release is not a
    # dependency -- it is a coincidence that currently works.
    #
    # These stay OUT of the core set on purpose. Training needs them; serving
    # does not, because rrip.forecast.service reads precomputed forecasts using
    # the standard library alone. That is what keeps the deployed API inside
    # the 250 MB serverless limit.
    "scikit-learn>=1.4",
    "joblib>=1.3",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    # tests/test_forecast_routing.py drives async functions with
    # @pytest.mark.anyio, which needs anyio's pytest PLUGIN. anyio is installed
    # here anyway -- httpx, starlette and watchfiles all require it -- so the
    # tests pass without this line and would keep passing right up until one of
    # those three dropped it.
    #
    # A static import scan does not catch this: the dependency is a pytest
    # marker, not an import. Undeclared, the failure mode is four async tests
    # silently ceasing to be async.
    "anyio>=4.0",
]

[project.scripts]
rrip = "rrip.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer.Option/Argument and fastapi.Query/Depends in defaults are those
# frameworks' documented idiom, not the mutable-default bug B008 exists to catch.
"src/rrip/cli.py" = ["B008"]
"src/rrip/api/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
